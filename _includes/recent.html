{% assign posts_by_year = site.posts | group_by_exp: "post", "post.date | date: '%Y'" %}

<well recentposts>
  <div columns>
	<div><h3>Blog Posts</h3></div>
	{% for year in posts_by_year %}
		<div>
			<h4>{{ year.name }}</h4>
			<p class="mb0">
				{% for post in year.items %}
					<a href="{{ post.url }}">{{ post.title }}</a><br>
				{% endfor %}
			</p>
		</div>
	{% endfor %}
  </div>
</well>
